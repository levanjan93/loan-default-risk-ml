services:
  jupyter:
    build: .
    container_name: jupyter_lab
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - JUPYTER_ENABLE_LAB=yes
      # Set before `docker compose up` — never use an empty token on a reachable host (see ../SECURITY.md).
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-local-dev-change-me}
    command:
      [
        "bash",
        "-c",
        "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook-dir=/app --ServerApp.token=\"$$JUPYTER_TOKEN\"",
      ]
