x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__FERNET_KEY: PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    MPLBACKEND: Agg
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  volumes: &airflow-common-volumes
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./utils:/opt/airflow/utils
    - ./data:/opt/airflow/data
    - ./datamart:/opt/airflow/datamart
    - ./model_store:/opt/airflow/model_store
    - ./outputs:/opt/airflow/outputs

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    restart: unless-stopped

  # Prints the Airflow URL once the webserver is healthy (Lab 5 style).
  airflow-info:
    <<: *airflow-common
    depends_on:
      airflow-webserver:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo ""
        echo "============================================================"
        echo "  Airflow is ready — open in your browser:"
        echo "  http://localhost:8080"
        echo "  Login: admin / admin"
        echo "  DAG:   loan_default_ml_pipeline"
        echo "============================================================"
        echo ""

volumes:
  airflow_data:
